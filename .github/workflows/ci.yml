name: Next CI

on:
  push:
    branches:
        - main
  pull_request:
    branches:
        - main
    

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install pnpm
        run : npm i -g pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Install dependencies
        run: pnpm run build